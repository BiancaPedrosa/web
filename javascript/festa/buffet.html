<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
<div id="tudo">
<header id="titulo">
    <h4>Calculadora de Orçamento de Festa</h4>
</header>
<form>
    <div>
        <label for="pessoas">Nº de pessoas
             <input name="opcao" type="number" id="pessoas" required>
         </label>
    </div>
    <div>
        <h4>Tipo de buffet</h3>
         <label for="custo1">
            <input name="buffet" type="radio" value="50" id="custo1">
           Buffet Básico (R$ 50 por pessoa)
        </label>
        <label for ="custo2">
           <input name="buffet" type="radio" value="80" id="custo2">
           Buffet Premium (R$ 80 por pessoa)
        </label>
    </div>
    <h4>Adicionais</h4>
    <label for="decoracao">
        <input type="checkbox" name="adicional" id="decoracao" value="200">
        Decoração Extra (R$ 200)
    </label>
     <label for="dj">
    <input type="checkbox" name="adicional" id="dj" value="350"> DJ e iluminação (R$ 350)
    </label>
    <label for="fotografo">
    <input type="checkbox" name="adicional" id="fotografo"value="450"> Fotografo Profissional (R$ 450)</label>
</form>
<br>
<input type="submit" value="Calcular orçamento" id="calcular" onclick="calcular()">
<div id="mostrartotal"></div>
<script>
    function calcular() {
    // 1. Pegar a quantidade de pessoas e converter para número
    let pessoas = parseFloat(document.querySelector("#pessoas").value);
    
    // 2. Verificar se um buffet foi selecionado (para evitar erro de "value of null")
    let buffetSelecionado = document.querySelector('input[name="buffet"]:checked');
    
    if (!pessoas || !buffetSelecionado) {
        alert("Por favor, preencha o número de pessoas e escolha um buffet.");
        return;
    }

    let custoBuffet = parseFloat(buffetSelecionado.value);
    let totalAdicionais = 0;

    // 3. Somar os adicionais (Checkboxes)
    let adicionais = document.querySelectorAll('input[name="adicional"]:checked');
    adicionais.forEach((item) => {
        totalAdicionais += parseFloat(item.value);
    });

    // 4. Cálculo final
    let totalGeral = (pessoas * custoBuffet) + totalAdicionais;

    // 5. Exibir o resultado formatado
    document.getElementById("mostrartotal").innerHTML = `
        <h3>Resumo do Orçamento:</h3>
        <p>Custo Buffet: R$ ${(pessoas * custoBuffet).toFixed(2)}</p>
        <p>Custo Adicionais: R$ ${totalAdicionais.toFixed(2)}</p>
        <strong>Total Final: R$ ${totalGeral.toFixed(2)}</strong>
    `;
}
</script>
</body>
</html>
