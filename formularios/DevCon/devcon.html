<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>DevCon 2024</title>
   <link rel="stylesheet" href="devcon.css">
</head>
<body>
   <form class="event-form">
      <fieldset>
         <legend>Inscrição DevCon</legend>
         
         <label>Data de Nascimento:</label>
         <input type="date">

         <label>Quantidade de Ingressos (1 a 5):</label>
         <input type="number" min="1" max="5">

         <label>Foto para o Crachá:</label>
         <input type="file">

         <label>Cor da Camiseta:</label>
         <input type="color">

         <label>Observações:</label>
         <textarea rows="3"></textarea>

         <button type="button">Confirmar Inscrição</button>
      </fieldset>
   </form>
</body>
</html>
