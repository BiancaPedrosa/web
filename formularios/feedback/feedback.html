<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Formulários</title>
   <link rel="stylesheet" href="feedback.css">
</head>
<body>
   <form class="feedback-form" action="#" method="POST">
      <h2>Sua Opinião</h2>
      
      <div class="field">
         <label for="nome">Nome Completo</label>
         <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="field">
         <label for="email">E-mail</label>
         <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
      </div>

      <div class="field">
         <label>Nível de Satisfação</label>
         <div class="radio-group">
            <input type="radio" id="bom" name="satisfacao" value="bom" checked>
            <label for="bom">Bom</label>
            <input type="radio" id="regular" name="satisfacao" value="regular">
            <label for="regular">Regular</label>
         </div>
      </div>

      <div class="field">
         <label for="categoria">Categoria</label>
         <select id="categoria" name="categoria">
            <option value="elogio">Elogio</option>
            <option value="sugestao">Sugestão</option>
            <option value="reclamacao">Reclamação</option>
         </select>
      </div>

      <div class="field">
         <label for="mensagem">Mensagem</label>
         <textarea id="mensagem" name="mensagem" rows="4"></textarea>
      </div>

      <button type="submit">Enviar Agora</button>
   </form>
</body>
</html>
