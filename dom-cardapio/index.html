<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cardápio Restaurante</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>Cardápio</h1>
        <h2>Salgados</h2>
    </header>

    <main>
        <table id="tabela-cardapio">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                </tr>
            </thead>
            <tbody id="corpo-cardapio">
                </tbody>
        </table>

        <section id="area-pedido">
            <h2>Pedido</h2>
            <div id="resumo-pedido" class="container-resumo">
                </div>
            <button id="btn-fechar">Fechar Pedido</button>
        </section>
    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
