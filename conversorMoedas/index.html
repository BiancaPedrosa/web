<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Conversor de Moedas</h1>
        <p>Converta valores estrangeiros para Real (BRL) em tempo real.</p>

        <section class="card">
            <div class="input-group">
                <label for="valor">Valor a converter:</label>
                <input type="number" id="valor" placeholder="Ex: 100.00" step="0.01">
            </div>

            <div class="input-group">
                <label for="moeda">Selecione a moeda:</label>
                <select id="moeda">
                    <option value="USD">Dólar Americano (USD)</option>
                    <option value="EUR">Euro (EUR)</option>
                    <option value="GBP">Libra Esterlina (GBP)</option>
                    <option value="ARS">Peso Argentino (ARS)</option>
                </select>
            </div>

            <button id="btn-converter">Converter para R$</button>

            <div id="resultado" class="hidden">
                <h2 id="valor-convertido">R$ 0,00</h2>
                <div id="detalhes">
                    <p id="cotacao-base">Cotação: R$ 0,00</p>
                    <p id="variacao">Variação: 0%</p>
                </div>
            </div>
            
            <div id="erro" class="error-msg hidden">
                Ocorreu um erro ao buscar os dados.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
